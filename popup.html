<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gmail Thread Reverser & Dark Mode Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-row">
      <img src="icons/icon48.png" alt="icon" class="logo">
      <div>
        <h2>Gmail Reverser & Dark</h2>
        <span class="sub">Thread Reverser & Material Dark Mode (v1.4.4)</span>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="setting-item">
      <div class="label-group">
        <label for="smartDark">Enable Dark Mode</label>
        <span class="desc">Official Material Dark scheme (#1f1f1f / #28292c)</span>
      </div>
      <input type="checkbox" id="smartDark" class="toggle">
    </div>

    <div class="setting-item">
      <div class="label-group">
        <label for="reverseOrder">Reverse Thread Order</label>
        <span class="desc">Display newest emails at the top</span>
      </div>
      <input type="checkbox" id="reverseOrder" class="toggle">
    </div>

    <div class="setting-item">
      <div class="label-group">
        <label for="replyPosition">Reply Box Position</label>
        <span class="desc">Location of the reply compose area</span>
      </div>
      <select id="replyPosition" class="select-box">
        <option value="bottom">Bottom (Default)</option>
        <option value="top">Top (Above newest email)</option>
      </select>
    </div>

    <div class="setting-item">
      <div class="label-group">
        <label for="showQuickBar">Floating Quick Bar</label>
        <span class="desc">Show quick toggle bar in bottom-right corner</span>
      </div>
      <input type="checkbox" id="showQuickBar" class="toggle">
    </div>
  </div>

  <div class="footer">
    <span>v1.4.4 | Print & Typing Optimized</span>
    <span class="status" id="status">Settings saved</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
