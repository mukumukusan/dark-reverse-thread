<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title data-i18n="extShortName">Dark Reverse Thread</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-row">
      <img src="icons/icon48.png" alt="" class="logo">
      <div>
        <h2 data-i18n="extShortName"></h2>
        <span class="sub" data-i18n="popupSubtitle"></span>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="setting-item">
      <div class="label-group">
        <label for="smartDark" data-i18n="settingDark"></label>
        <span class="desc" data-i18n="settingDarkDesc"></span>
      </div>
      <input type="checkbox" id="smartDark" class="toggle">
    </div>

    <div class="setting-item">
      <div class="label-group">
        <label for="reverseOrder" data-i18n="settingReverse"></label>
        <span class="desc" data-i18n="settingReverseDesc"></span>
      </div>
      <input type="checkbox" id="reverseOrder" class="toggle">
    </div>

    <div class="setting-item" id="replySetting">
      <div class="label-group">
        <label for="replyPosition" data-i18n="settingReply"></label>
        <span class="desc" id="replyDesc"></span>
      </div>
      <select id="replyPosition" class="select-box">
        <option value="bottom" data-i18n="replyBottom"></option>
        <option value="top" data-i18n="replyTop"></option>
      </select>
    </div>

    <div class="setting-item">
      <div class="label-group">
        <label for="showQuickBar" data-i18n="settingQuickBar"></label>
        <span class="desc" data-i18n="settingQuickBarDesc"></span>
      </div>
      <input type="checkbox" id="showQuickBar" class="toggle">
    </div>
  </div>

  <div class="tip" id="themeTip" hidden>
    <span data-i18n="tipGmailDarkTheme"></span>
    <button type="button" class="tip-button" id="openTheme" data-i18n="tipOpenTheme"></button>
  </div>

  <div class="footer">
    <span><span id="version"></span> | <span data-i18n="footerTagline"></span></span>
    <span class="status" id="status" data-i18n="statusSaved"></span>
  </div>

  <div class="support">
    <a href="https://buymeacoffee.com/mukumukusan" target="_blank" rel="noopener noreferrer" data-i18n="supportLink"></a>
  </div>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
