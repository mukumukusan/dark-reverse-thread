  <title>Gmail surfaces on a light theme</title>

  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail();
// Gmail surfaces fixed one by one in the full sweep (class names as in Gmail)
document.getElementById('body1').insertAdjacentHTML('afterend', `

  <div class="ajA SK" id="details"><span class="gI" id="details-label">From:</span><span id="details-name">Someone</span></div>`);
document.getElementById('m3').querySelector('.inner').insertAdjacentHTML('beforeend', '<div class="Bswxkd" id="undo"></div>');
document.body.insertAdjacentHTML('beforeend', `
  <div class="J-M" role="menu" id="label-menu"><input class="bqf" id="label-search"><div class="J-N-Jo" id="menu-icon"></div></div>
  <div class="eVDL2-aLs" id="link-popup"><input id="link-input"></div>
  <div class="aM7" id="emoji-picker"><button class="bAr" id="emoji-tab">x</button></div>
  <div class="uW2Fw-bHo" id="date-dialog"><span id="date-title">Pick date</span><div class="J-JB-KA" id="date-calendar"><table><tr><td class="J-JB-KA-a1R-JB" id="past-day">1</td><td class="J-JB-KA-JB" id="day">20</td></tr></table></div></div>
  <div class="SK ZF-zT" id="search-panel"><div class="btl acK" id="filter-back"></div><label class="aD" id="filter-checkbox">Skip</label><a class="btn" id="filter-help">Help</a></div>
  <div class="nH fY" role="tablist" id="settings-tabs"><div class="f1">General</div></div>
  <div class="nH r4" id="settings"><img id="settings-image" src=""><span>Language</span></div>
  <div class="IU" id="quick-settings"><img id="quick-image" src=""><div class="XO" id="quick-theme"></div></div>
  <div class="t9" role="menu" id="help-menu"><div class="ua bk5" id="help-active">Help</div><div class="ua" id="help-item">Training</div><div class="ub" id="help-rule"></div></div>
  <div class="d-Qs-Jh-JF" id="input-tools-scrim" style="opacity: 0.5"></div>
  <div class="aHij0b-aLs" id="gemini-panel"><img id="gemini-image" src=""></div>
  <div role="main" id="mail-list"><span id="mail-row">row</span></div>`);

  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

const $ = (id) => document.getElementById(id);
const filter = (id) => getComputedStyle($(id)).filter;

test('on a light Gmail theme the theme class stays off', async () => {
  await sleep(1500);
  assert(!hasClass(html, 'gtr-gmail-dark-theme'));
});

test('settings pages are left as Gmail draws them', () => {
  assertEqual(filter('settings'), 'none');
  assertEqual(filter('settings-tabs'), 'none');
});

test('quick settings, help menu and scrim are left as Gmail draws them', () => {
  assertEqual(filter('quick-settings'), 'none');
  assert(getComputedStyle($('help-menu')).backgroundColor !== 'rgb(40, 41, 44)');
  assert(getComputedStyle($('input-tools-scrim')).backgroundColor !== 'rgb(0, 0, 0)');
});

test('Gemini panel and mail-list menus are left as Gmail draws them', () => {
  assertEqual(filter('gemini-panel'), 'none');
  $('mail-row').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  assert(!hasClass(html, 'gtr-menu-source'));
});

test('date dialogs are left as Gmail draws them', () => {
  assert(getComputedStyle($('date-dialog')).backgroundColor !== 'rgb(40, 41, 44)');
});

test('the thread itself is still dark (the extension\'s own part)', () => {
  assertEqual(getComputedStyle($('main')).backgroundColor, 'rgb(31, 31, 31)');
  assertEqual(getComputedStyle($('details')).backgroundColor, 'rgb(40, 41, 44)');
});

runTests();

  </script>
</body>
