<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Email body colors</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0;  }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail();
// A transparent 40x40 logo and a 2x2 spacer, drawn on canvases so no files are needed
const png = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c.toDataURL(); };
document.getElementById('body1').insertAdjacentHTML('beforeend', `
  <span id="black" style="color: #000000">black</span>
  <span id="red" style="color: #ff0000">red</span>
  <a id="link" style="color: #1a0dab">link</a>
  <span id="light-text" style="color: #e0e0e0">already light</span>
  <div id="white-bg" style="background: #ffffff">white</div>
  <span id="important-text" style="color: #414552 !important">a bank notice's gray, set with !important</span>
  <div id="important-bg" style="background-color: #ffffff !important">white box set with !important</div>
  <a id="pure-blue" style="color: #0000ff">pure blue link</a>
  <style>#common_contents .stts_color { color: #0e3dad !important; background-color: #ffffff !important; }</style>
  <div id="common_contents"><table><tr><td class="stts_color" id="id-rule-text">a balance set by an ID rule with !important</td></tr></table></div>
  <div id="yellow-bg" style="background: #ffff00"><img id="logo-on-yellow" src="${png(40, 40)}"></div>
  <div id="dark-bg" style="background: #101010">dark</div>
  <div id="light-border" style="border: 1px solid #f0f0f0; border-top: 0">card with a light frame</div>
  <div id="dark-border" style="border: 1px solid #333333">dark frame</div>
  <div id="important-border" style="border-left: 2px solid #ffffff !important">white rule set with !important</div>
  <p id="marker" style="background: #ffff00"><span><strong id="marker-text" style="color: #555555">gray on a yellow marker</strong></span></p>
  <table><tr><td id="teal-cell" style="background: #c8eef7"><a id="teal-link" style="color: #1a73e8">blue link on a pale teal cell</a></td></tr></table>
  <div id="half-bg" style="background: rgba(255, 255, 255, 0.5)">half</div>
  <div id="card-image" style="background-image: url(${png(4, 4)}); color: #5f6368">on a light picture</div>
  <div id="photo-image" style="background-image: url(${png(4, 4)}); color: #ffffff">on a photo</div>
  <div id="gradient-card" style="background-image: linear-gradient(#ffffff, #f1f3f4); color: #202124">on a light gradient</div>
  <div id="tinted-image" style="background: #ffff00 url(${png(4, 4)}); color: #000000">tinted</div>
  <img id="framed-cover" src="${png(40, 60)}" style="border: 2px solid #dddddd">
  <img id="logo" src="${png(40, 40)}">
  <div><img id="logo-left" src="${png(40, 40)}"><img id="logo-right" src="${png(40, 40)}" style="padding-left: 10px"></div>
  <img id="padded-block" src="${png(40, 40)}" style="display: block; padding: 8px; margin: 0 auto">
  <div style="background-color: #2975f2; padding: 50px 20px 0"><img id="padded-logo" src="${png(219, 32)}" style="display: block; padding: 0 0 20px"></div>
  <img id="bordered-logo" src="${png(60, 40)}" style="display: block; padding: 6px; border: 1px solid #cccccc">
  <img id="big" src="${png(400, 200)}">
  <img id="spacer" src="${png(2, 2)}">`);
window.__GTR_MOCK__ = {};
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

const $ = (id) => document.getElementById(id);
const fg = (id) => $(id).style.getPropertyValue('--gtr-fg').trim();
const bg = (id) => $(id).style.getPropertyValue('--gtr-bg').trim();
const color = (id) => getComputedStyle($(id)).color;
const background = (id) => getComputedStyle($(id)).backgroundColor;

test('black text becomes light grey', async () => {
  await sleep(500);
  assertEqual(fg('black'), 'rgba(227, 227, 227, 1)');
  assertEqual(color('black'), 'rgb(227, 227, 227)', 'applied by styles.css');
});

test('red text keeps its hue and gets lighter', () => {
  assertEqual(color('red'), 'rgb(255, 77, 77)');
});

test('a dark blue link becomes a lighter blue', () => {
  assertEqual(color('link'), 'rgb(128, 118, 245)', 'lighter blue, readable on the dark page');
});

test('text that is already light keeps its lightness', () => {
  assertEqual(color('light-text'), 'rgb(224, 224, 224)');
});

test('colors the email set inline with !important are adapted too', () => {
  assertEqual(color('important-text'), 'rgb(173, 177, 190)');
  assertEqual(background('important-bg'), 'rgb(31, 31, 31)');
});

test('colors from the email\'s own CSS with an ID and !important are adapted too', () => {
  const [r, g, b] = color('id-rule-text').match(/\d+/g).map(Number);
  assert(r > 60 && g > 100 && b > 200, `light blue, got ${color('id-rule-text')}`);
  assertEqual(background('id-rule-text'), 'rgb(31, 31, 31)');
});

test('a pure blue link is raised to a readable contrast on the dark page (same hue)', () => {
  const [r, g, b] = color('pure-blue').match(/\d+/g).map(Number);
  const lum = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lum(r) + 0.7152 * lum(g) + 0.0722 * lum(b);
  const page = 0.2126 * lum(31) + 0.7152 * lum(31) + 0.0722 * lum(31);
  assert((L + 0.05) / (page + 0.05) >= 4.5, `contrast of ${color('pure-blue')}`);
  assert(b > r && b > g, 'still blue');
});

test('text on a highlight is raised against the highlight\'s dark shade, not the page', () => {
  const lum = (c) => { const [r, g, b] = c.match(/\d+/g).map(Number).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const ratio = (a, b) => { const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x); return (hi + 0.05) / (lo + 0.05); };
  assert(ratio(color('marker-text'), background('marker')) >= 4.5, `${color('marker-text')} on ${background('marker')}`);
  assert(ratio(color('teal-link'), background('teal-cell')) >= 4.5, `${color('teal-link')} on ${background('teal-cell')}`);
  const [r, g, b] = color('teal-link').match(/\d+/g).map(Number);
  assert(b > r, 'the link stays blue');
});

test('light borders drawn for a white page turn a subtle dark gray; dark borders stay', () => {
  const style = getComputedStyle($('light-border'));
  assertEqual(style.borderLeftColor, style.borderRightColor);
  const [r, g, b] = style.borderLeftColor.match(/\d+/g).map(Number);
  assert(r === g && g === b && r > 31 && r < 80, `subtle gray, got ${style.borderLeftColor}`);
  assertEqual(getComputedStyle($('dark-border')).borderLeftColor, 'rgb(51, 51, 51)');
  const cover = getComputedStyle($('framed-cover')).borderLeftColor.match(/\d+/g).map(Number);
  assert(cover[0] < 80, `frame around an image, got ${getComputedStyle($('framed-cover')).borderLeftColor}`);
  const imp = getComputedStyle($('important-border')).borderLeftColor.match(/\d+/g).map(Number);
  assert(imp[0] < 80, `inline !important border, got ${getComputedStyle($('important-border')).borderLeftColor}`);
});

test('white backgrounds turn dark', () => {
  assertEqual(background('white-bg'), 'rgb(31, 31, 31)');
});

test('a yellow highlight becomes a dark shade of the same hue', () => {
  assertEqual(background('yellow-bg'), 'rgb(112, 112, 0)');
});

test('dark backgrounds stay dark', () => {
  assertEqual(background('dark-bg'), 'rgb(16, 16, 16)');
});

test('alpha is kept', () => {
  assertEqual(bg('half-bg'), 'rgba(31, 31, 31, 0.5)');
});

test('original colors are kept for turning dark mode off', () => {
  assertEqual($('black').style.getPropertyValue('--gtr-fg0').trim(), 'rgba(0, 0, 0, 1)');
  assertEqual($('white-bg').style.getPropertyValue('--gtr-bg0').trim(), 'rgba(255, 255, 255, 1)');
});

test('elements without their own background are not given one', () => {
  assert(!$('black').hasAttribute('data-gtr-bg'));
});

test('a background picture under dark text is multiplied by the dark page color', () => {
  assert($('card-image').hasAttribute('data-gtr-bgimg'));
  assertEqual(background('card-image'), 'rgb(31, 31, 31)');
  assertEqual(getComputedStyle($('card-image')).backgroundBlendMode, 'multiply');
  assert(getComputedStyle($('card-image')).backgroundImage.includes('url('), 'the picture stays');
});

test('a light gradient under dark text is darkened the same way', () => {
  assert($('gradient-card').hasAttribute('data-gtr-bgimg'));
  assertEqual(getComputedStyle($('gradient-card')).backgroundBlendMode, 'multiply');
  assertEqual(background('gradient-card'), 'rgb(31, 31, 31)');
});

test('a background picture under light text (a photo) is left alone', () => {
  assert(!$('photo-image').hasAttribute('data-gtr-bgimg'));
  assertEqual(getComputedStyle($('photo-image')).backgroundBlendMode, 'normal');
});

test('a background picture on a colored box is multiplied by that box\'s dark color', () => {
  assertEqual(background('tinted-image'), 'rgb(112, 112, 0)');
  assertEqual(getComputedStyle($('tinted-image')).backgroundBlendMode, 'multiply');
});

test('a transparent logo gets a softened white backdrop and a card frame', async () => {
  await waitFor(() => $('logo').hasAttribute('data-gtr-img'), 2000);
  assertEqual($('logo').style.getPropertyValue('--gtr-img-bg').trim(), 'rgb(232, 234, 237)');
  assert($('logo').hasAttribute('data-gtr-img-card'), 'logo-sized image is a card');
  assertEqual(getComputedStyle($('logo')).backgroundColor, 'rgb(232, 234, 237)');
});

test('a logo on a colored box gets that original color as its backdrop', async () => {
  await waitFor(() => $('logo-on-yellow').hasAttribute('data-gtr-img'), 2000);
  assertEqual($('logo-on-yellow').style.getPropertyValue('--gtr-img-bg').trim(), 'rgba(255, 255, 0, 1)');
});

test('two logos in a row stay apart: the padding between them gets no backdrop or card ring', async () => {
  await waitFor(() => $('logo-right').hasAttribute('data-gtr-img'), 2000);
  const right = getComputedStyle($('logo-right'));
  assertEqual(right.paddingLeft, '0px', 'the padding moved out of the image');
  assertEqual(right.marginLeft, '10px', 'into the margin');
  assertEqual($('logo-right').getBoundingClientRect().left - $('logo-left').getBoundingClientRect().right, 10, 'same gap as in the email');
  assertEqual(right.backgroundClip, 'content-box');
});

test('a centered block image keeps its padding and auto margin; its card is cut to the picture plus the ring', async () => {
  await waitFor(() => $('padded-block').hasAttribute('data-gtr-img'), 2000);
  assert(!$('padded-block').hasAttribute('data-gtr-img-pad'));
  const cs = getComputedStyle($('padded-block'));
  assertEqual(cs.paddingLeft, '8px');
  assertEqual($('padded-block').style.getPropertyValue('--gtr-img-clip').trim(), 'inset(4px 4px 4px 4px round 10px)');
  assert(cs.clipPath.startsWith('inset('), `clipped: ${cs.clipPath}`);
});

test('a block logo with padding only below (Chrome Web Store mail): no dark band inside its card, same layout', async () => {
  await waitFor(() => $('padded-logo').hasAttribute('data-gtr-img-card'), 2000);
  const logo = $('padded-logo');
  assertEqual(logo.getBoundingClientRect().height, 52, 'the 20px padding below stays (the header keeps its height)');
  assertEqual(logo.style.getPropertyValue('--gtr-img-clip').trim(), 'inset(-4px -4px 16px -4px round 10px)',
    'the ring reaches outside where there is no padding; below, the padding past the ring is cut away');
  assertEqual(getComputedStyle(logo).backgroundClip, 'border-box', 'the backdrop fills the ring inside the padding');
});

test('a block logo with padding and a border is not cut: its border stays', async () => {
  await waitFor(() => $('bordered-logo').hasAttribute('data-gtr-img-card'), 2000);
  assert(!$('bordered-logo').hasAttribute('data-gtr-img-clip'), 'cutting to the picture would remove the border outside the padding');
  assertEqual(getComputedStyle($('bordered-logo')).clipPath, 'none');
  assertEqual(getComputedStyle($('bordered-logo')).borderTopWidth, '1px');
});

test('large images get a backdrop but no card frame', async () => {
  await waitFor(() => $('big').hasAttribute('data-gtr-img'), 2000);
  assert(!$('big').hasAttribute('data-gtr-img-card'));
});

test('tiny images (spacers, tracking pixels) are left alone', async () => {
  await sleep(200);
  assert(!$('spacer').hasAttribute('data-gtr-img'));
});

// Printing: the screen rules still apply, and the @media print block must win over them. Emulate it by
// appending the print block's rules unconditionally (same cascade order as when printing).
function emulatePrint() {
  const sheet = [...document.styleSheets].find((s) => (s.href || '').endsWith('styles.css'));
  const print = [...sheet.cssRules].find((r) => r.media && r.media.mediaText === 'print');
  const style = document.createElement('style');
  style.textContent = [...print.cssRules].map((r) => r.cssText).join('\n');
  document.head.appendChild(style);
  return () => style.remove();
}

test('printing uses the email\'s original colors (the print rules beat the dark ones)', () => {
  const undo = emulatePrint();
  try {
    assertEqual(color('black'), 'rgb(0, 0, 0)', 'text');
    assertEqual(color('red'), 'rgb(255, 0, 0)', 'red text');
    assertEqual(background('white-bg'), 'rgb(255, 255, 255)', 'background');
    assertEqual(background('yellow-bg'), 'rgb(255, 255, 0)', 'highlight');
    assertEqual(getComputedStyle($('card-image')).backgroundBlendMode, 'normal', 'no multiply on paper');
    assertEqual(getComputedStyle($('padded-logo')).clipPath, 'none', 'images are not cut on paper');
    assertEqual(color('important-text'), 'rgb(65, 69, 82)', 'inline !important text');
    assertEqual(background('important-bg'), 'rgb(255, 255, 255)', 'inline !important background');
    assertEqual(color('id-rule-text'), 'rgb(14, 61, 173)', 'ID rule text');
    assertEqual(getComputedStyle($('light-border')).borderLeftColor, 'rgb(240, 240, 240)', 'light border');
    assertEqual(getComputedStyle($('important-border')).borderLeftColor, 'rgb(255, 255, 255)', 'inline !important border');
  } finally {
    undo();
  }
});

test('turning dark mode off shows the original colors again', async () => {
  chrome.storage.sync.set({ smartDark: false });
  await waitFor(() => !hasClass(html, 'gmail-dark-active'), 2000);
  assertEqual(color('black'), 'rgb(0, 0, 0)');
  assertEqual(background('white-bg'), 'rgb(255, 255, 255)');
  assertEqual(background('yellow-bg'), 'rgb(255, 255, 0)');
  assertEqual(color('important-text'), 'rgb(65, 69, 82)', 'inline !important text');
  assertEqual(background('important-bg'), 'rgb(255, 255, 255)', 'inline !important background');
});

runTests();

  </script>
</body>
</html>
