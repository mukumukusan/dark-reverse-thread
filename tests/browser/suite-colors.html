const $ = (id) => document.getElementById(id);
const fg = (id) => $(id).style.getPropertyValue('--gtr-fg').trim();
const bg = (id) => $(id).style.getPropertyValue('--gtr-bg').trim();
const color = (id) => getComputedStyle($(id)).color;
const background = (id) => getComputedStyle($(id)).backgroundColor;

test('black text becomes light grey', async () => {
  await sleep(500);
  assertEqual(fg('black'), 'rgba(227, 227, 227, 1)');

});

test('red text keeps its hue and gets lighter', () => {

});

test('a dark blue link becomes a lighter blue', () => {

test('text that is already light keeps its lightness', () => {

});

test('colors the email set inline with !important are adapted too', () => {

test('colors from the email\'s own CSS with an ID and !important are adapted too', () => {

  assertEqual(background('id-rule-text'), 'rgb(31, 31, 31)');
});

test('a pure blue link is raised to a readable contrast on the dark page (same hue)', () => {
  const [r, g, b] = color('pure-blue').match(/\d+/g).map(Number);
  const lum = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lum(r) + 0.7152 * lum(g) + 0.0722 * lum(b);
  const page = 0.2126 * lum(31) + 0.7152 * lum(31) + 0.0722 * lum(31);
  assert((L + 0.05) / (page + 0.05) >= 4.5, `contrast of ${color('pure-blue')}`);
  assert(b > r && b > g, 'still blue');
});

test('text on a highlight is raised against the highlight\'s dark shade, not the page', () => {
  const lum = (c) => { const [r, g, b] = c.match(/\d+/g).map(Number).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const ratio = (a, b) => { const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x); return (hi + 0.05) / (lo + 0.05); };
  assert(ratio(color('marker-text'), background('marker')) >= 4.5, `${color('marker-text')} on ${background('marker')}`);
  assert(ratio(color('teal-link'), background('teal-cell')) >= 4.5, `${color('teal-link')} on ${background('teal-cell')}`);
  const [r, g, b] = color('teal-link').match(/\d+/g).map(Number);
  assert(b > r, 'the link stays blue');
});

// Printing: the screen rules still apply, and the @media print block must win over them. Emulate it by
// appending the print block's rules unconditionally (same cascade order as when printing).
function emulatePrint() {
  const sheet = [...document.styleSheets].find((s) => (s.href || '').endsWith('styles.css'));
  const print = [...sheet.cssRules].find((r) => r.media && r.media.mediaText === 'print');
  const style = document.createElement('style');
  style.textContent = [...print.cssRules].map((r) => r.cssText).join('\n');
  document.head.appendChild(style);
  return () => style.remove();
}

test('printing uses the email\'s original colors (the print rules beat the dark ones)', () => {
  const undo = emulatePrint();
  try {
    assertEqual(color('black'), 'rgb(0, 0, 0)', 'text');
    assertEqual(color('red'), 'rgb(255, 0, 0)', 'red text');
    assertEqual(background('white-bg'), 'rgb(255, 255, 255)', 'background');
    assertEqual(background('yellow-bg'), 'rgb(255, 255, 0)', 'highlight');
    assertEqual(getComputedStyle($('card-image')).backgroundBlendMode, 'normal', 'no multiply on paper');
    assertEqual(getComputedStyle($('padded-logo')).clipPath, 'none', 'images are not cut on paper');
    assertEqual(color('important-text'), 'rgb(65, 69, 82)', 'inline !important text');
    assertEqual(background('important-bg'), 'rgb(255, 255, 255)', 'inline !important background');
    assertEqual(color('id-rule-text'), 'rgb(14, 61, 173)', 'ID rule text');
    assertEqual(getComputedStyle($('light-border')).borderLeftColor, 'rgb(240, 240, 240)', 'light border');
    assertEqual(getComputedStyle($('important-border')).borderLeftColor, 'rgb(255, 255, 255)', 'inline !important border');
  } finally {
    undo();
  }
});

// Copy the given nodes the way the user would: select them, fire "copy" with a clipboard, read what was written
const copyNodes = (first, last, type = 'copy') => {
  const range = document.createRange();
  range.setStartBefore(first);
  range.setEndAfter(last);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  const data = new DataTransfer();
  const event = type === 'copy'
    ? new ClipboardEvent('copy', { clipboardData: data, bubbles: true, cancelable: true })
    : new DragEvent('dragstart', { dataTransfer: data, bubbles: true, cancelable: true });
  first.dispatchEvent(event);
  selection.removeAllRanges();
  return { html: data.getData('text/html'), text: data.getData('text/plain'), handled: event.defaultPrevented || data.getData('text/html') !== '' };
};

test('copying from an email writes the email\'s own colors, not the dark display colors (they went into replies)', () => {
  const { html, text, handled } = copyNodes($('black'), $('important-bg'));
  assert(handled, 'the copy is written by the extension');
  assert(!/gtr/.test(html), `no trace of the extension's colors or attributes: ${html}`);
  assert(html.includes('color: rgb(0, 0, 0)'), `black stays black: ${html}`);
  assert(html.includes('color: rgb(255, 0, 0)'), `red stays the email's red: ${html}`);
  assert(html.includes('color: rgb(65, 69, 82) !important'), `an inline !important color is written back as the email had it: ${html}`);
  assert(html.includes('background-color: rgb(255, 255, 255) !important'), `and its !important background: ${html}`);
  assert(!html.includes('rgb(227, 227, 227)') && !html.includes('rgb(31, 31, 31)'), `no light display text or dark display background: ${html}`);
  assert(text.includes('black') && text.includes('red'), `the plain text is there too: ${text}`);
});

test('dragging a selection out of an email carries the email\'s own colors too', () => {
  const { html } = copyNodes($('black'), $('red'), 'dragstart');
  assert(html.includes('color: rgb(0, 0, 0)') && !/gtr/.test(html), `dragged markup: ${html}`);

  const data = new DataTransfer();
  const event = new ClipboardEvent('copy', { clipboardData: data, bubbles: true, cancelable: true });
  input.dispatchEvent(event);
  input.remove();
  assert(!event.defaultPrevented && data.getData('text/html') === '', 'not touched');
});

test('copying a whole email leaves no trace of the extension (images, frames, classes) and restores !important frames', () => {
  assert($('important-border').style.getPropertyValue('border-left-color').includes('var(--gtr-'), 'the page itself wraps the !important line color');
  const { html } = copyNodes($('body1'), $('body1'));
  assert(!/gtr/.test(html), `no data-gtr-*, --gtr-* or gtr-* class left: ${html.match(/.{60}gtr.{60}/)}`);
  assert(!html.includes('var('), 'no var() left');
  assert(/<img[^>]*id="logo"/.test(html), 'the images are copied');
  const frame = html.match(/<div id="important-border" style="([^"]*)"/);
  assert(frame && frame[1].includes('rgb(255, 255, 255) !important'), `the !important line keeps its own white: ${frame && frame[1]}`);
});

// Copy only the text inside one element (the way a word is double-clicked): the elements around it are outside the range
const copyText = (el) => {
  const range = document.createRange();
  range.selectNodeContents(el.firstChild);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  const data = new DataTransfer();
  el.dispatchEvent(new ClipboardEvent('copy', { clipboardData: data, bubbles: true, cancelable: true }));
  selection.removeAllRanges();
  return { html: data.getData('text/html'), text: data.getData('text/plain') };
};

test('copying a word inside a link, bold and a colored span keeps the link, the bold and the email\'s color', () => {
  const { html } = copyText($('deep-word'));
  assert(html.includes('href="https://example.com/"'), `the link: ${html}`);
  assert(html.includes('<b>'), `the bold: ${html}`);
  assert(html.includes('color: rgb(255, 0, 0)'), `the email's red: ${html}`);
  assert(!/gtr/.test(html), `no trace of the extension: ${html}`);
});

  assert(!/<(table|tbody|tr|td)\b/.test(html), `a word does not bring the email's tables (fixed widths, nesting) along: ${html}`);

test('colors written as names (white, black) are judged too', () => {
  const span = copyText($('white-named'));
  assert(span.html.includes('snow') && !/color: white/i.test(span.html), `a lone white written as a name is dropped: ${span.html}`);
  const font = copyText($('white-named-font'));
  assert(font.html.includes('ice') && !/color="white"/i.test(font.html), `<font color="white"> too: ${font.html}`);
  const cell = copyText($('white-on-black'));
  assert(/color: white/i.test(cell.html) && /background-color: (black|rgb\(0, 0, 0\))/i.test(cell.html), `white on a black cell keeps both: ${cell.html}`);
  assert(!/width/.test(cell.html), `no fixed widths from the table: ${cell.html}`);
});

  assert(!span.html.includes('rgb(255, 255, 255)'), `the white is dropped: ${span.html}`);
  const font = copyText($('white-font'));
  assert(font.html.includes('pale') && !/color="#ffffff"/i.test(font.html), `<font color> too: ${font.html}`);
});

// Copy from inside one element's text to inside another's (the way a drag-selection across cells or items ends)
const copyBetween = (startEl, endEl) => {
  const range = document.createRange();
  range.setStart(startEl.firstChild, 0);
  range.setEnd(endEl.firstChild, endEl.firstChild.length);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  const data = new DataTransfer();
  startEl.dispatchEvent(new ClipboardEvent('copy', { clipboardData: data, bubbles: true, cancelable: true }));
  selection.removeAllRanges();
  return { html: data.getData('text/html'), text: data.getData('text/plain') };
};

test('text the email hides (a preheader hidden by its own style rules) is not copied', () => {
  const { html } = copyNodes($('shown-part'), $('hidden-part'));
  assert(html.includes('shown') && !html.includes('secret preheader'), `only what is shown: ${html}`);
});

test('text the page hides by other means is not copied either: a 1px tooltip (Gmail\'s button labels), opacity 0, font-size 0, max-height 0', () => {
  const { html } = copyNodes($('vh-first'), $('vh-last'));
  assert(html.includes('visible start') && html.includes('visible end'), `the shown text: ${html}`);
  for (const hidden of ['tooltip label', 'see-through words', 'zero size words', 'collapsed words']) {
    assert(!html.includes(hidden), `"${hidden}" is not copied: ${html}`);
  }
});

test('a selection across table cells is copied as a table (it fell apart into loose cells)', () => {
  const { html } = copyBetween($('a1'), $('b2'));
  assert(/<table\b/.test(html) && /<tr\b/.test(html) && /<td\b/.test(html), `table, rows and cells: ${html}`);
  assert(['A1', 'B1', 'A2', 'B2'].every((cell) => html.includes(cell)), `all four cells: ${html}`);
});

test('a selection across list items is copied as a list (bullets kept)', () => {
  const { html } = copyBetween($('li1'), $('li2'));
  assert(/<ul\b/.test(html) && /<li\b/.test(html) && html.includes('first') && html.includes('second'), `a list: ${html}`);
});

test('text in a cell that sets both the dark background and the white text keeps both (it went out dark on dark)', () => {
  const { html } = copyText($('banner'));
  assert(/color: (rgb\(255, 255, 255\)|#ffffff)/.test(html) && /background-color: (rgb\(0, 0, 0\)|#000000)/.test(html), `white on black: ${html}`);
});

test('several paragraphs from a dark cell are wrapped in a block, so the background is drawn behind them', () => {
  const { html } = copyBetween($('bm1'), $('bm2'));
  assert(/^<div style="[^"]*background-color: (rgb\(0, 0, 0\)|#000000)/.test(html), `a block wrapper with the background: ${html}`);
  assert(/color: (rgb\(255, 255, 255\)|#ffffff)/.test(html) && html.includes('line two'), `with the white text: ${html}`);
});

test('a picture is not a background for light text (blocked images, Outlook): the white is dropped', () => {
  const { html } = copyText($('white-on-image'));
  assert(html.includes('over a picture') && !/rgb\(255, 255, 255\)|#ffffff/i.test(html), `white dropped: ${html}`);
});

test('a transparent cell does not hide the real dark background further out', () => {
  const { html } = copyText($('white-in-clear'));
  assert(html.includes('rgb(255, 255, 255)') && /background-color: (rgb\(0, 0, 0\)|#000000)/.test(html), `white kept with the outer black: ${html}`);
});

test('a cell background set only with bgcolor (with or without #) keeps its white text', () => {
  for (const id of ['white-on-attr', 'white-on-bare']) {
    const { html } = copyText($(id));
    assert(html.includes('rgb(255, 255, 255)') && /background-color: (rgb\(51, 51, 51\)|#333333)/.test(html), `${id}: ${html}`);
  }
});

test('a banner whose background and white text are set with !important keeps both (the background was lost)', () => {
  const { html } = copyText($('imp-banner'));
  assert(/color: (rgb\(255, 255, 255\)|#ffffff)/i.test(html) && /background-color: (rgb\(0, 0, 51\)|#000033)/i.test(html), `white on navy: ${html}`);
  assert(!html.includes('var('), `no var(): ${html}`);
});

test('a text color and a background from different blocks are not paired when they can\'t be read together', () => {
  const dark = copyText($('inner-card'));
  assert(!(dark.html.includes('rgb(51, 51, 51)') && dark.html.includes('rgb(17, 17, 17)')), `no dark grey on near-black: ${dark.html}`);
  assert(dark.html.includes('card text'), `the text is there: ${dark.html}`);
  const light = copyText($('ghost-card'));
  assert(!(light.html.includes('rgb(255, 255, 255)') && light.html.includes('rgb(238, 238, 238)')), `no white on light grey: ${light.html}`);
  assert(!/color: (rgb\(255, 255, 255\)|#ffffff)/i.test(light.html), `white text left without a dark background is dropped: ${light.html}`);
});

test('white text on a light highlight the email set on a span is dropped (it can\'t be read there either)', () => {
  const { html } = copyText($('white-on-light-mark'));
  assert(html.includes('pale mark') && !html.includes('rgb(255, 255, 255)'), `the white is dropped: ${html}`);
});

test('paragraphs inside a <font> in a dark cell get a block wrapper (the background is drawn behind them)', () => {
  const { html } = copyBetween($('fp1'), $('fp2'));
  assert(/^<div style="[^"]*background-color: (rgb\(0, 0, 0\)|#000000)/.test(html), `a block wrapper: ${html}`);
  assert(/color="#ffffff"/i.test(html) && html.includes('para two'), `the white font stays: ${html}`);
});

test('a see-through background is copied as a solid color (Outlook drops see-through colors: white on white)', () => {
  const { html } = copyText($('white-on-translucent'));
  assert(!html.includes('rgba('), `no see-through color: ${html}`);
  assert(html.includes('background-color: rgb(102, 102, 102)') && html.includes('rgb(255, 255, 255)'), `the color it gives on a white page (60% black = #666), with the white: ${html}`);
});

test('a light color the email writes through its own var() is judged by its fallback value', () => {
  const { html } = copyText($('var-white'));
  assert(html.includes('varwhite') && !/var\(--brand/.test(html.replace(/color: var\(--brand, #ffffff\)/, 'KEPT')) && !html.includes('#ffffff'), `the white is dropped: ${html}`);
});

test('copying across two messages does not carry Gmail\'s message classes (the reply would be treated as an email)', () => {
  const { html } = copyNodes($('text1'), $('text2'));
  assert(html.includes('Message 1') && html.includes('Message 2'), `both messages: ${html}`);
  assert(!/class="[^"]*\b(a3s|adn|ii|gt)\b/.test(html), `no a3s / adn classes: ${html}`);
  assert(!/\border:/.test(html), `no order from the newest-first layout: ${html}`);
});

test('with an input field focused (search box, subject, To), copying is left to the browser even if the page has a selection', () => {
  const input = document.createElement('input');
  input.value = 'search words';
  document.body.appendChild(input);
  input.focus();
  const range = document.createRange();
  range.selectNodeContents($('black'));
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
  const focused = document.activeElement === input;
  const data = new DataTransfer();
  const event = new ClipboardEvent('copy', { clipboardData: data, bubbles: true, cancelable: true });
  input.dispatchEvent(event);
  window.getSelection().removeAllRanges();
  input.remove();
  assert(focused, 'the input kept the focus while the page had a selection');
  assert(!event.defaultPrevented && data.getData('text/html') === '', 'not touched');
  const control = copyText($('black'));
  assert(control.html.includes('black'), `control: the same selection without the input is written by the extension: ${control.html}`);
});

test('a link only partly in the selection, grabbed by its unselected part, is dragged as the link', () => {
  const range = document.createRange();
  range.setStartBefore($('red'));
  range.setEnd($('link').firstChild, 2);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
  const data = new DataTransfer();
  $('link').dispatchEvent(new DragEvent('dragstart', { dataTransfer: data, bubbles: true, cancelable: true }));
  window.getSelection().removeAllRanges();
  assertEqual(data.getData('text/html'), '');
  const control = copyNodes($('red'), $('link'), 'dragstart');
  assert(control.html.includes('link'), `control: a link fully inside the selection is dragged with it: ${control.html}`);
});

test('a link dragged on its own (no selection) keeps the browser\'s data', () => {
  window.getSelection().removeAllRanges();
  const data = new DataTransfer();
  $('link').dispatchEvent(new DragEvent('dragstart', { dataTransfer: data, bubbles: true, cancelable: true }));
  assertEqual(data.getData('text/html'), '');
});

test('turning dark mode off shows the original colors again', async () => {
  chrome.storage.sync.set({ smartDark: false });
  await waitFor(() => !hasClass(html, 'gmail-dark-active'), 2000);
  assertEqual(color('black'), 'rgb(0, 0, 0)');
  assertEqual(background('white-bg'), 'rgb(255, 255, 255)');
  assertEqual(background('yellow-bg'), 'rgb(255, 255, 0)');
  assertEqual(color('important-text'), 'rgb(65, 69, 82)', 'inline !important text');
  assertEqual(background('important-bg'), 'rgb(255, 255, 255)', 'inline !important background');
});

test('with dark mode off, copying is left to the browser', () => {
  const { handled } = copyNodes($('black'), $('red'));
  assert(!handled, 'nothing is written by the extension');
});
