<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>"Choose a theme" when Gmail offers no theme picker</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0; background: #ffffff; }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail();
document.getElementById('compose-window').remove();
// The gear opens no theme choice (e.g. an admin locked the theme): no "View all"
window.__GTR_MOCK__ = {};
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

const notice = () => document.getElementById('gtr-theme-notice');

test('if Gmail offers no theme picker, "Choose a theme" ends the notice for good (nothing to choose)', async () => {
  await waitFor(notice, 3000);
  notice().querySelectorAll('button')[0].click();
  assert(!notice(), 'closed for this visit');
  await sleep(4000); // longer than the wait for "View all"
  assertEqual(gtrStores.local.themeNoticeCloses, 3);
});

runTests();

  </script>
</body>
</html>
