<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Light theme notice and the popup's theme button</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0; background: #ffffff; }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail();
document.getElementById('compose-window').remove();
// Gmail's gear opens quick settings with "View all", which opens the theme dialog
const gear = document.getElementById('gear');
gear.addEventListener('click', () => {
  gear.setAttribute('aria-expanded', 'true');
  if (document.querySelector('[jsname="JFZqac"]')) return;
  const viewAll = document.createElement('button');
  viewAll.setAttribute('jsname', 'JFZqac');
  viewAll.addEventListener('click', () => {
    document.body.insertAdjacentHTML('beforeend', '<div role="dialog"><div role="option" bgid="basicblack">Dark</div></div>');
  });
  document.body.appendChild(viewAll);
});
window.__GTR_MOCK__ = {};
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

const notice = () => document.getElementById('gtr-theme-notice');

test('opening the theme picker from the popup takes the notice away and ends it once Dark is shown', async () => {
  await waitFor(notice, 3000);
  await gtrSendMessage({ type: 'gtr-open-theme-settings' });
  assert(!notice(), 'not left over Gmail\'s theme dialog');
  await waitFor(() => gtrStores.local.themeNoticeCloses === 3, 3000);
  assertEqual(gtrStores.local.themeNoticeCloses, 3);
});

runTests();

  </script>
</body>
</html>
