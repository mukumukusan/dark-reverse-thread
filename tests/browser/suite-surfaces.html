<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gmail surfaces on the dark theme</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0; background: #111111; }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail();
// Gmail surfaces fixed one by one in the full sweep (class names as in Gmail)
document.getElementById('body1').insertAdjacentHTML('afterend', `
  <a class="aQy" id="attachment"><div class="aSG" id="attachment-thumb"></div><div class="aYy" id="attachment-cover"><span>name.xlsx</span></div><span class="aV3" id="attachment-name">name.xlsx</span></a>
  <div class="ajA SK" id="details"><span class="gI" id="details-label">From:</span><span id="details-name">Someone</span></div>`);
document.getElementById('m3').querySelector('.inner').insertAdjacentHTML('beforeend', '<div class="Bswxkd" id="undo"></div>');
document.body.insertAdjacentHTML('beforeend', `
  <div class="J-M" role="menu" id="label-menu"><input class="bqf" id="label-search"><div class="J-N-Jo" id="menu-icon"></div></div>
  <div class="eVDL2-aLs" id="link-popup"><input id="link-input"></div>
  <div class="aM7" id="emoji-picker"><button class="bAr" id="emoji-tab">x</button></div>
  <div class="uW2Fw-bHo" id="date-dialog"><span id="date-title">Pick date</span><div class="J-JB-KA" id="date-calendar"><table><tr><td class="J-JB-KA-a1R-JB" id="past-day">1</td><td class="J-JB-KA-JB" id="day">20</td></tr></table></div></div>
  <div class="SK ZF-zT" id="search-panel"><div class="btl acK" id="filter-back"></div><label class="aD" id="filter-checkbox">Skip</label><a class="btn" id="filter-help">Help</a></div>
  <div class="nH fY" role="tablist" id="settings-tabs"><div class="f1">General</div></div>
  <div class="nH r4" id="settings"><img id="settings-image" src=""><span>Language</span></div>`);
window.__GTR_MOCK__ = {};
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

const $ = (id) => document.getElementById(id);
const bg = (id) => getComputedStyle($(id)).backgroundColor;
const color = (id) => getComputedStyle($(id)).color;
const filter = (id, pseudo) => getComputedStyle($(id), pseudo || null).filter;
const press = (id) => $(id).dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
const SURFACE = 'rgb(40, 41, 44)';
const INVERT = 'invert(1) hue-rotate(180deg)';

test('Gmail dark theme detected (prerequisite)', async () => {
  await waitFor(() => hasClass(html, 'gtr-gmail-dark-theme'), 2000);
  assert(hasClass(html, 'gtr-gmail-dark-theme'));
});

test('attachment card without a preview is dark', () => {
  assertEqual(bg('attachment'), SURFACE);
  assertEqual(bg('attachment-thumb'), SURFACE);
  assertEqual(bg('attachment-cover'), 'rgb(53, 54, 58)');
  assertEqual(color('attachment-name'), 'rgb(227, 227, 227)');
});

test('recipient details popup is dark and readable', () => {
  assertEqual(bg('details'), SURFACE);
  assertEqual(color('details-name'), 'rgb(227, 227, 227)');
  assertEqual(color('details-label'), 'rgb(154, 160, 166)');
});

test('undo / redo pill is dark', () => {
  assertEqual(bg('undo'), 'rgb(60, 64, 67)');
});

test('popups opened from the thread are dark: label search, link, emoji, menu icons', () => {
  press('text1');
  assertEqual(bg('label-search'), 'rgb(60, 64, 67)');
  assertEqual(bg('link-popup'), SURFACE);
  assertEqual(bg('emoji-picker'), SURFACE);
  assertEqual(bg('emoji-tab'), 'rgb(60, 64, 67)');
  assertEqual(filter('menu-icon'), INVERT);
});

test('the same popups keep Gmail\'s look when opened from elsewhere', () => {
  press('outside');
  assert(bg('link-popup') !== SURFACE && bg('emoji-picker') !== SURFACE);
  assert(bg('label-search') !== 'rgb(60, 64, 67)');
});

test('date dialogs (snooze, schedule send) are dark, past days muted', () => {
  assertEqual(bg('date-dialog'), SURFACE);
  assertEqual(color('date-title'), 'rgb(227, 227, 227)');
  assertEqual(color('past-day'), 'rgb(154, 160, 166)');
  assertEqual(color('day'), 'rgb(227, 227, 227)');
});

test('filter step: checkbox, back arrow and help icon are inverted, help text is light', () => {
  assertEqual(filter('filter-checkbox', '::before'), INVERT);
  assertEqual(filter('filter-back'), INVERT);
  assertEqual(filter('filter-help', '::before'), INVERT);
  assertEqual(color('filter-help'), 'rgb(196, 199, 197)');
});

test('settings pages are inverted over a light grey base; images are inverted back', () => {
  assertEqual(filter('settings'), INVERT);
  assertEqual(bg('settings'), 'rgb(224, 224, 224)');
  assertEqual(filter('settings-tabs'), INVERT);
  assertEqual(filter('settings-image'), INVERT);
});

runTests();

  </script>
</body>
</html>
