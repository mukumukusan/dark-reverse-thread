test('the page body is put back when the browser scrolls it (focus inside a filtered panel)', async () => {
  // Like Gmail: neither the page nor the body scrolls (both overflow: hidden), so the body is its own scroller
  const root = document.documentElement;
  const body = document.body;
  const old = [root.style.cssText, body.style.cssText];
  root.style.cssText = 'overflow: hidden; height: 100%';
  body.style.cssText = 'overflow: hidden; height: 100%; margin: 0';
  const filler = document.createElement('div');
  filler.style.height = '3000px';
  body.appendChild(filler);
  body.scrollTop = 500;
  assert(body.scrollTop > 0, 'the browser can scroll the body (as it did in Gmail)');
  // The browser fires scroll events when it draws a frame, so wait for frames, not time: under the test
  // runner's virtual time a 1 s wait could end before any frame was drawn (failed about 1 run in 3)
  for (let frame = 0; frame < 30 && body.scrollTop !== 0; frame++) await nextFrame();
  assertEqual(body.scrollTop, 0);
  filler.remove();
  [root.style.cssText, body.style.cssText] = old;
});

// The display color a ::highlight() gives the text of an element in the editor, or null if none
function shownAs(id) {
  const text = $(id).firstChild;
  for (const [name, highlight] of CSS.highlights) {
    if (name === 'gtr-editor-warn') continue;
    for (const range of highlight) {
      if (range.startContainer !== text) continue;
      const sheet = document.getElementById('gtr-editor-colors').sheet;
      const rule = Array.from(sheet.cssRules).find((r) => r.selectorText === `::highlight(${name})`);
      return rule ? rule.style.color : null;
    }
  }
  return null;
}

test('reply / compose: colors the user picks are shown lighter only when too dark to read, keeping the hue', async () => {
  await waitFor(() => shownAs('typed-black') !== null, 2000);
  assertEqual(shownAs('typed-black'), 'rgb(227, 227, 227)', 'black is shown light gray');
  const navy = (shownAs('typed-navy') || '').match(/\d+/g);
  assert(navy && +navy[2] > +navy[0] && +navy[2] > 150, `dark navy is shown as a light blue, got ${shownAs('typed-navy')}`);
  assertEqual(shownAs('typed-red'), null, 'a readable red stays as chosen');
  assertEqual(shownAs('typed-on-yellow'), null, 'black on a yellow marker is readable as it is');
  assertEqual(shownAs('quote-black'), null, 'the quoted history is flipped as a whole instead');
  assertEqual($('typed-black').getAttribute('color'), '#000000', 'the email itself is not changed');
  assertEqual($('typed-black').getAttribute('style'), null);
});

const underlined = (id) => {
  const highlight = CSS.highlights.get('gtr-editor-warn');
  return !!highlight && Array.from(highlight).some((range) => range.startContainer === $(id).firstChild);
};
const composeToggle = () => $('compose').querySelector('.gtr-compose-toggle');

test('reply / compose: text in a color recipients can hardly read on white is underlined, and the toolbar button says so', async () => {
  await waitFor(() => underlined('typed-white'), 2000);
  assert(underlined('typed-white'), 'white text: readable here, invisible on a white screen');
  assertEqual(shownAs('typed-white'), null, 'its color is shown as chosen');
  assert(!underlined('typed-black') && !underlined('typed-red') && !underlined('typed-navy'), 'colors readable on white are not underlined');
  assert(!underlined('quote-black'), 'the quoted history is not checked');
  assertEqual(composeToggle().getAttribute('data-gtr-warn'), 'true');
});

test('reply / compose: a "show colors as sent" button sits in the toolbar before the trash can', async () => {
  await waitFor(() => composeToggle(), 2000);
  const cell = composeToggle().closest('td');
  assertEqual(cell.nextElementSibling, $('trash-cell'));
  assertEqual($('compose').querySelectorAll('.gtr-compose-toggle').length, 1, 'added once');
  assertEqual(composeToggle().getAttribute('aria-pressed'), 'false');
  assertEqual(composeToggle().getAttribute('aria-label'), 'composeOriginalShow');
  assert(!composeToggle().closest('.Am'), 'never inside the editor (that would be sent)');
  const middle = (el) => { const r = el.getBoundingClientRect(); return r.top + r.height / 2; };
  const offset = middle(composeToggle()) - middle($('more-icon'));
  assert(Math.abs(offset) < 1, `centered with the icon next to it like Gmail's own (was 4px too high), off by ${offset.toFixed(1)}px`);
});

test('reply / compose: pressed, the editor shows the white page and the colors exactly as sent; pressed again, dark', async () => {
  composeToggle().click();
  assert(hasClass($('compose'), 'gtr-compose-original'));
  assertEqual(composeToggle().getAttribute('aria-pressed'), 'true');
  const editor = $('compose').querySelector('.Am');
  assertEqual(getComputedStyle(editor).backgroundColor, 'rgb(255, 255, 255)');
  assertEqual(getComputedStyle(editor).color, 'rgb(34, 34, 34)');
  assertEqual(filter('quote'), 'none', 'the quoted history is not flipped');
  assertEqual(color('body-link'), 'rgb(17, 85, 204)', 'links keep their own color');
  await waitFor(() => shownAs('typed-black') === null && !underlined('typed-white'), 2000);
  assertEqual(shownAs('typed-black'), null, 'no lighter display color');
  assert(!underlined('typed-white'), 'no underline: the white page shows the problem itself');

  composeToggle().click();
  assert(!hasClass($('compose'), 'gtr-compose-original'));
  await waitFor(() => shownAs('typed-black') !== null, 2000);
  assertEqual(shownAs('typed-black'), 'rgb(227, 227, 227)');
  assertEqual(filter('quote'), INVERT);
});

  const text = $('typed-black').firstChild;
  text.appendData(' more');
  $('typed-black').dispatchEvent(new InputEvent('input', { bubbles: true }));
  await waitFor(() => {
    for (const highlight of CSS.highlights.values()) {
      for (const range of highlight) if (range.startContainer === text && range.endOffset === text.length) return true;
    }
    return false;
  }, 2000);
  let covered = false;
  for (const highlight of CSS.highlights.values()) {
    for (const range of highlight) if (range.startContainer === text && range.endOffset === text.length) covered = true;
  }
  assert(covered, 'the highlight covers the whole text, including the new letters');
});

test('reply / compose: the quoted history (opened with "…") is the original email with light and dark flipped', () => {
  assertEqual(filter('quote'), INVERT, 'flipping keeps the hues of colored text');
  assertEqual(bg('quote'), 'rgb(224, 224, 224)', 'flips to the page color #1f1f1f');
  assertEqual(color('quote-signature'), 'rgb(34, 34, 34)', 'text set to #222 inline (a signature) flips to #ddd instead of staying dark on dark');
  assertEqual(color('quote-link-inner'), 'rgb(5, 99, 193)', 'links keep their own blue, which flips to a light blue');
  assertEqual(filter('quote-image'), INVERT, 'images are flipped back to their own colors');
  assertEqual(filter('nested-quote'), 'none', 'an older quote inside is not flipped a second time');
});

// Last: it changes the editor's content
test('reply / compose: picking white in dark mode puts white into the email', () => {
  const editor = $('compose').querySelector('.Am');
  assertEqual(color('plain-word'), 'rgb(227, 227, 227)', 'plain text is light gray, not a color Gmail offers: with #ffffff the browser saw "already white" and skipped the color');
  editor.focus();
  const range = document.createRange();
  range.selectNodeContents($('plain-word'));
  const selection = getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  document.execCommand('foreColor', false, '#ffffff');
  assert($('plain-word').querySelector('font[color="#ffffff"]') || $('plain-word').closest('font[color="#ffffff"]'),
    `white is set in the email: ${$('plain-word').outerHTML}`);
});
