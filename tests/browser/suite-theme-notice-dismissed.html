<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gmail light theme notice already closed</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0; background: #ffffff; }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail();
document.getElementById('compose-window').remove();
window.__GTR_MOCK__ = { local: { themeNoticeDismissed: true } };
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

test('a notice closed once never comes back', async () => {
  await sleep(1500);
  document.body.appendChild(document.createElement('div'));
  await sleep(300);
  assertEqual(gtrStores.local.gmailLightTheme, true, 'the light theme was seen');
  assert(!document.getElementById('gtr-theme-notice'));
});

runTests();

  </script>
</body>
</html>
