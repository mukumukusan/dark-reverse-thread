<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gmail light theme notice closed with "Got it"</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0; background: #ffffff; }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail();
document.getElementById('compose-window').remove();
window.__GTR_MOCK__ = { messages: { themeNotice: 'Theme notice', tipOpenTheme: 'Choose a theme', darkReaderNoticeOk: 'Got it' } };
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

const notice = () => document.getElementById('gtr-theme-notice');

test('"Got it" closes the notice for good, without opening anything', async () => {
  await waitFor(notice, 3000);
  notice().querySelectorAll('button')[1].click();
  assert(!notice(), 'closed');
  assertEqual(document.getElementById('gear').getAttribute('aria-expanded'), 'false', 'the gear was not pressed');
  await sleep(50);
  assertEqual(gtrStores.local.themeNoticeDismissed, true);
  document.body.appendChild(document.createElement('div'));
  await sleep(500);
  assert(!notice(), 'not shown again');
});

runTests();

  </script>
</body>
</html>
