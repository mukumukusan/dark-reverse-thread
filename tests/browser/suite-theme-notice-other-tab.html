<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Light theme notice ended from another Gmail tab</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0; background: #ffffff; }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail();
document.getElementById('compose-window').remove();
window.__GTR_MOCK__ = { local: { gmailLightTheme: true } };
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

test('"Choose a theme" pressed in another Gmail tab ends the notice here too', async () => {
  const notice = () => document.getElementById('gtr-theme-notice');
  await waitFor(notice, 3000);
  assert(notice(), 'shown');
  chrome.storage.local.set({ themeNoticeCloses: 3 }); // what the other tab saves
  await waitFor(() => !notice(), 1000);
  assert(!notice(), 'gone here too');
});

runTests();

  </script>
</body>
</html>
