<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>No light theme notice where Gmail has no gear (e.g. a conversation opened in its own window)</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0; background: #ffffff; }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail({ header: false });
document.getElementById('compose-window').remove();
window.__GTR_MOCK__ = { local: { gmailLightTheme: true } };
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

test('without Gmail\'s gear, "Choose a theme" could not work, so no notice', async () => {
  await sleep(1000);
  document.body.appendChild(document.createElement('div'));
  await sleep(300);
  assert(!document.getElementById('gtr-theme-notice'));
});

runTests();

  </script>
</body>
</html>
