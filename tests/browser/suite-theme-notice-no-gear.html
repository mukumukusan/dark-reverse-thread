<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>No light theme notice where Gmail has no gear (e.g. a conversation opened in its own window)</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0; background: #ffffff; }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail({ header: false });
document.getElementById('compose-window').remove();
window.__GTR_MOCK__ = { local: { gmailLightTheme: true } };
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

test('without Gmail\'s gear, "Choose a theme" could not work, so no notice', async () => {
  await sleep(1000);
  document.body.appendChild(document.createElement('div'));
  await sleep(300);
  assert(!document.getElementById('gtr-theme-notice'));
});

test('once the gear is there, the page is judged light and the notice shows', async () => {
  document.body.insertAdjacentHTML('afterbegin',
    '<header role="banner" id="header"><a class="FH" role="button" aria-expanded="false" id="gear">⚙</a></header>');
  await waitFor(() => document.getElementById('gtr-theme-notice'), 2000);
  assert(document.getElementById('gtr-theme-notice'));
});

test('"Choose a theme" with the gear gone leaves the notice and the count alone', async () => {
  document.getElementById('header').remove();
  document.getElementById('gtr-theme-notice').querySelectorAll('button')[0].click(); // before Gmail's change is seen
  assert(document.getElementById('gtr-theme-notice'), 'still there');
  await sleep(50);
  assert(!('themeNoticeCloses' in gtrStores.local), 'nothing counted');
});

runTests();

  </script>
</body>
</html>
