<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>A picture theme: Gmail's theme unknown</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>body { margin: 0; background: transparent; }</style>
</head>
<body>
  <script src="harness.js"></script>
  <script src="gmail-fixture.js"></script>
  <script>
buildGmail();
document.getElementById('compose-window').remove();
// Last seen on a light theme; the user has since picked a picture theme (body background transparent)
window.__GTR_MOCK__ = { local: { gmailLightTheme: true } };
</script>
  <script src="chrome-mock.js"></script>
  <script src="../../settings.js"></script>
  <script src="../../content.js"></script>
  <script>

test('a picture theme forgets the old "light" answer, so no theme notice', async () => {
  await sleep(1500);
  document.body.appendChild(document.createElement('div'));
  await sleep(500);
  assertEqual(gtrStores.local.gmailLightTheme, null, 'unknown');
  assert(!document.getElementById('gtr-theme-notice'));
});

runTests();

  </script>
</body>
</html>
